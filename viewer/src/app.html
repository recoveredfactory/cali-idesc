<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />

		<!-- Umami analytics. data-domains scopes sends to the production hosts only,
		     so localhost/preview builds never emit. App state lives in the URL hash
		     (not routes), so custom events — not pageviews — are the primary signal. -->
		<script
			defer
			src="https://cloud.umami.is/script.js"
			data-website-id="1677d6d9-1d63-466f-84f5-0a8a1560e8b7"
			data-domains="cali.recoveredfactory.net,lo-demas-es-loma.recoveredfactory.net"
		></script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
