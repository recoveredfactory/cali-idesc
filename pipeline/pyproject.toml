[project]
name = "cali_geo"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "anthropic>=0.105.2",
    "dagster==1.13.7",
    "lxml>=6.1.1",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
    "pmtiles>=3.7.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "cali_geo"
registry_modules = [
    "cali_geo.components.*",
]


